{% extends "base.html" %}

{% block content %}

<div class="auth-card">

    <div class="lock">
        🔐
    </div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to your secure account
    </p>


    <form method="POST">


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            maxlength="30"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit"
                class="btn full">
            Login
        </button>

    </form>


    <p class="bottom-text">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </p>

</div>

{% endblock %}
