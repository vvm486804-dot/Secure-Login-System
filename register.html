{% extends "base.html" %}

{% block content %}

<div class="auth-card">

    <h2>Create Account</h2>

    <p class="subtitle">
        Register a new secure account
    </p>


    <form method="POST"
          onsubmit="return validateRegisterForm()">


        <label>
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 8 characters"
            required
        >


        <div class="password-info">

            Password must contain:

            <br>

            ✓ At least 8 characters

            <br>

            ✓ Letters

            <br>

            ✓ Numbers

        </div>


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >


        <button type="submit"
                class="btn full">
            Register
        </button>

    </form>


    <p class="bottom-text">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

{% endblock %}
